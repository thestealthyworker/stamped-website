<svg width="375" height="812" viewBox="0 0 375 812" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <title>Stamped — Contractor app, Voice Note screen (Screen 5 of 7), post-recording state</title>

  <!-- screen background -->
  <rect x="0" y="0" width="375" height="812" fill="#F7F8FA"/>

  <!-- header -->
  <rect x="0" y="0" width="375" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="375" y2="56" stroke="#E4E4E7" stroke-width="1"/>
  <text x="16" y="34" font-size="20" fill="#0A0A0B">&#8592;</text>
  <text x="44" y="34" font-size="17" font-weight="700" fill="#0A0A0B">Voice Note</text>
  <text x="359" y="33" font-size="12" font-weight="500" fill="#A1A1AA" text-anchor="end">Step 4 of 6</text>

  <!-- instruction -->
  <text x="187" y="104" font-size="17" font-weight="600" fill="#0A0A0B" text-anchor="middle">Describe what you did and any</text>
  <text x="187" y="128" font-size="17" font-weight="600" fill="#0A0A0B" text-anchor="middle">materials used.</text>

  <!-- timer -->
  <text x="187" y="205" font-family="JetBrains Mono, monospace" font-size="14" font-weight="500" fill="#52525B" text-anchor="middle">00:24</text>

  <!-- record button (post-recording: shows checkmark ring, not the live rec dot) -->
  <circle cx="187" cy="270" r="44" fill="#00B37E"/>
  <circle cx="187" cy="270" r="44" fill="none" stroke="#E6F7F2" stroke-width="6" opacity="0.6"/>
  <path d="M 170 270 L 182 282 L 206 256" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- waveform -->
  <g fill="#00B37E">
    <rect x="107" y="340" width="4" height="14" rx="2"/>
    <rect x="119" y="330" width="4" height="34" rx="2"/>
    <rect x="131" y="322" width="4" height="50" rx="2"/>
    <rect x="143" y="336" width="4" height="22" rx="2"/>
    <rect x="155" y="318" width="4" height="58" rx="2"/>
    <rect x="167" y="328" width="4" height="38" rx="2"/>
    <rect x="179" y="316" width="4" height="62" rx="2"/>
    <rect x="191" y="326" width="4" height="42" rx="2"/>
    <rect x="203" y="332" width="4" height="30" rx="2"/>
    <rect x="215" y="320" width="4" height="54" rx="2"/>
    <rect x="227" y="336" width="4" height="22" rx="2"/>
    <rect x="239" y="330" width="4" height="34" rx="2"/>
    <rect x="251" y="342" width="4" height="10" rx="2"/>
  </g>

  <!-- playback bar -->
  <circle cx="40" cy="418" r="14" fill="#0F1F3D"/>
  <path d="M 36 412 L 48 418 L 36 424 Z" fill="#FFFFFF"/>
  <rect x="64" y="414" width="216" height="6" rx="3" fill="#E4E4E7"/>
  <rect x="64" y="414" width="132" height="6" rx="3" fill="#00B37E"/>
  <circle cx="196" cy="417" r="5" fill="#00B37E"/>
  <text x="335" y="421" font-family="JetBrains Mono, monospace" font-size="11" fill="#52525B" text-anchor="end">00:24 / 00:41</text>

  <!-- record again -->
  <text x="187" y="460" font-size="14" font-weight="500" fill="#00B37E" text-anchor="middle">Record Again</text>

  <!-- transcription preview -->
  <rect x="24" y="492" width="327" height="108" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>
  <text x="40" y="518" font-size="13" fill="#52525B">&#8220;Fixed the leaking P-trap under the kitchen</text>
  <text x="40" y="540" font-size="13" fill="#52525B">sink at unit 08-21. Replaced with new PVC</text>
  <text x="40" y="562" font-size="13" fill="#52525B">pipe and sealant, tested for leaks after...&#8221;</text>
  <text x="40" y="584" font-size="12" font-weight="500" fill="#00B37E">Tap to expand</text>

  <!-- primary CTA -->
  <rect x="16" y="730" width="343" height="44" rx="12" fill="#00B37E"/>
  <text x="187" y="757" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">Next: Review</text>
</svg>

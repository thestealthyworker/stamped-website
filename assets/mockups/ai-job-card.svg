<svg width="720" height="620" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <title>Stamped — AI Job Card mockup (sample data, fictional development)</title>
  <defs>
    <clipPath id="cardClip"><rect x="0" y="200" width="720" height="360" rx="18" ry="18"/></clipPath>
  </defs>

  <!-- ============ BEFORE / AFTER PHOTO COMPARISON ============ -->
  <text x="0" y="14" font-size="11" font-weight="700" letter-spacing="0.8" fill="#A1A1AA">BEFORE / AFTER</text>

  <!-- BEFORE photo -->
  <rect x="0" y="26" width="336" height="150" rx="10" fill="#E4E4E7"/>
  <circle cx="60" cy="76" r="14" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 20 150 L 100 90 L 150 130 L 210 70 L 320 150 Z" fill="#FFFFFF" opacity="0.55"/>
  <rect x="12" y="150" width="52" height="18" rx="4" fill="rgba(15,31,61,0.7)"/>
  <text x="38" y="163" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">BEFORE</text>

  <!-- arrow -->
  <line x1="344" y1="101" x2="372" y2="101" stroke="#00B37E" stroke-width="2"/>
  <path d="M 366 94 L 376 101 L 366 108" fill="none" stroke="#00B37E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AFTER photo -->
  <rect x="384" y="26" width="336" height="150" rx="10" fill="#E4E4E7"/>
  <circle cx="444" cy="76" r="14" fill="#FFFFFF" opacity="0.7"/>
  <path d="M 404 150 L 484 90 L 534 130 L 594 70 L 704 150 Z" fill="#FFFFFF" opacity="0.55"/>
  <rect x="396" y="150" width="44" height="18" rx="4" fill="rgba(0,179,126,0.85)"/>
  <text x="418" y="163" font-size="10" font-weight="600" fill="#FFFFFF" text-anchor="middle">AFTER</text>

  <!-- ============ AI JOB CARD ============ -->
  <rect x="0" y="200" width="720" height="360" rx="18" ry="18" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1"/>

  <g clip-path="url(#cardClip)">
    <!-- header strip -->
    <rect x="0" y="200" width="720" height="44" fill="#E6F7F2"/>
    <line x1="0" y1="244" x2="720" y2="244" stroke="#C6F0E2" stroke-width="1"/>
    <text x="24" y="227" font-size="12" font-weight="700" letter-spacing="0.8" fill="#065F46">AI JOB CARD</text>
    <rect x="592" y="212" width="104" height="20" rx="10" fill="#00B37E"/>
    <text x="644" y="226" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.4">HIGH CONFIDENCE</text>

    <!-- row: JOB TYPE -->
    <text x="24" y="266" font-size="11" font-weight="700" letter-spacing="0.8" fill="#A1A1AA">JOB TYPE</text>
    <text x="24" y="286" font-size="14" font-weight="500" fill="#0A0A0B">Plumbing Repair</text>
    <line x1="0" y1="296" x2="720" y2="296" stroke="#F1F1F3" stroke-width="1"/>

    <!-- row: PROPERTY -->
    <text x="24" y="318" font-size="11" font-weight="700" letter-spacing="0.8" fill="#A1A1AA">PROPERTY</text>
    <text x="24" y="338" font-size="14" font-weight="500" fill="#0A0A0B">Amberhill Court · #08-21</text>
    <line x1="0" y1="348" x2="720" y2="348" stroke="#F1F1F3" stroke-width="1"/>

    <!-- row: DATE & TIME (mono) -->
    <text x="24" y="370" font-size="11" font-weight="700" letter-spacing="0.8" fill="#A1A1AA">DATE &amp; TIME</text>
    <text x="24" y="390" font-size="13" font-family="JetBrains Mono, monospace" fill="#0A0A0B">14 Aug 2026, 10:42 AM</text>
    <line x1="0" y1="400" x2="720" y2="400" stroke="#F1F1F3" stroke-width="1"/>

    <!-- row: MATERIALS -->
    <text x="24" y="422" font-size="11" font-weight="700" letter-spacing="0.8" fill="#A1A1AA">MATERIALS USED</text>
    <rect x="24" y="432" width="64" height="22" rx="6" fill="#F3F4F6"/>
    <text x="56" y="447" font-size="12" font-weight="500" fill="#374151" text-anchor="middle">PVC Pipe</text>
    <rect x="96" y="432" width="58" height="22" rx="6" fill="#F3F4F6"/>
    <text x="125" y="447" font-size="12" font-weight="500" fill="#374151" text-anchor="middle">Sealant</text>
    <rect x="162" y="432" width="58" height="22" rx="6" fill="#F3F4F6"/>
    <text x="191" y="447" font-size="12" font-weight="500" fill="#374151" text-anchor="middle">P-Trap</text>

    <!-- summary -->
    <rect x="0" y="460" width="720" height="100" fill="#F7F8FA"/>
    <text x="24" y="488" font-size="14" font-style="italic" fill="#52525B">Replaced leaking P-trap under kitchen sink. Pressure-tested</text>
    <text x="24" y="510" font-size="14" font-style="italic" fill="#52525B">for 10 minutes post-repair — no further leakage observed.</text>
  </g>

  <!-- stamp badge overlay, -8px offset, -3deg rotation per Stamped-07 §4 -->
  <g transform="rotate(-3 676 552)">
    <rect x="644" y="520" width="64" height="64" rx="8" fill="#FFFFFF" stroke="#00B37E" stroke-width="2.5"/>
    <path d="M 660 552 L 672 564 L 696 538" fill="none" stroke="#00B37E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
